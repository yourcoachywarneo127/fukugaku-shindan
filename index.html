<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>復学可能性診断</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- スタート画面 -->
    <div id="start-screen" class="screen active">
      <h1>復学可能性診断</h1>
      <p class="description">
        お子さまの現在の状態から、保護者の方が今できるアプローチや復学に向けたステップを診断します。
      </p>
      <button id="start-btn" class="btn primary-btn">診断をはじめる</button>

      <!-- 追加: 診断ID復元エリア -->
      <div class="restore-box">
        <h3>以前の診断結果を見る</h3>
        <p class="restore-desc">お持ちの「診断ID」を入力すると、過去の診断結果を表示できます。</p>
        <div class="restore-input-group">
          <input type="text" id="restore-id-input" placeholder="例: FK-A1B2C3D4" />
          <button id="restore-btn" class="btn secondary-btn">結果を見る</button>
        </div>
        <p id="restore-error" class="error-msg" style="display: none;">※正しい診断IDを入力してください</p>
      </div>
    </div>

    <!-- 質問画面 -->
    <div id="question-screen" class="screen">
      <div class="progress-bar">
        <div id="progress" class="progress-fill"></div>
      </div>
      <span id="question-number" class="step-indicator"></span>
      <h2 id="question-text"></h2>
      <div id="options-container" class="options-group"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
      <div class="result-header">
        <span id="result-type-badge" class="badge"></span>
        <h2 id="result-type-name"></h2>
        <p class="id-display">診断ID: <strong id="result-id"></strong></p>
      </div>

      <div class="result-body">
        <div class="result-section">
          <h3>🌱 お子さまの現在の状態</h3>
          <p id="result-status-text"></p>
        </div>

        <div class="result-section">
          <h3>💡 保護者の方へのおすすめアプローチ</h3>
          <ul id="result-action-list"></ul>
        </div>
      </div>

      <div class="cta-box">
        <h3>LINEで個別のアドバイスを受ける</h3>
        <p>診断ID（<span id="cta-id-preview"></span>）を公式LINE宛にお送りいただくと、より詳しいアドバイスをお届けできます。</p>
        <button id="line-btn" class="btn line-btn">LINEで相談する（診断IDをコピー）</button>
      </div>

      <button id="restart-btn" class="btn outline-btn">もう一度診断する</button>
    </div>

  </div>

  <!-- データファイルとメインスクリプト -->
  <script src="data/types.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/results.js"></script>
  <script src="script.js"></script>
</body>
</html>
